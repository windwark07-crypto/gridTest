<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>인증 대시보드 차트 예제</title>
<!-- 공통 차트 번들 (grid/chart.js → window.common.CommonChart) -->
<script type="module" th:src="@{/js/lib/chart.min.js}"></script>
<script nomodule th:src="@{/js/lib/polyfills-legacy.min.js}"></script>
<script nomodule th:src="@{/js/lib/chart-legacy.min.js}"></script>
<style>
  :root{
    --fail: #f6b3ae;
    --success: #a9b6f2;
    --fail-active: #e2372b;
    --success-active: #3f5be0;
    --text-main: #1c1c1e;
    --text-sub: #8a8a8f;
    --border: #eee;
  }
  *{box-sizing:border-box;}
  body{
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    background:#f5f6f8;
    margin:0;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:20px;
    align-items:center;
  }
  .card{
    background:#fff;
    border-radius:16px;
    padding:24px 28px;
    width:900px;
    box-shadow:0 1px 4px rgba(0,0,0,0.05);
  }
  .card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
  }
  .card-title{
    font-size:16px;
    font-weight:700;
    color:var(--text-main);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card-title .badge{
    font-size:13px;
    font-weight:600;
    color:#3f5be0;
  }
  .card-sub{
    font-size:12px;
    color:var(--text-sub);
  }
  /* 넓은 차트를 카드 폭 안에서 가로 스크롤로 표시 */
  .chart-scroll{ overflow-x:auto; overflow-y:hidden; }
  #stackedChart{ display:block; }
  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    font-size:12px;
    color:var(--text-sub);
  }
  .legend{ display:flex; gap:14px; }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* ---- Segmented bar card ---- */
  .seg-bar{
    display:flex;
    width:100%;
    height:14px;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .seg-bar div{ height:100%; }
  /* 래퍼 없이 canvas 단독 사용 (크기는 canvas width/height 속성으로 지정) */
  #segChart{ display:block; margin-bottom:20px; }
  .seg-list{
    display:grid;
    grid-template-columns: 1fr 1fr;
    row-gap:14px;
    column-gap:24px;
  }
  .seg-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--text-main);
  }
  .seg-item .label{ display:flex; align-items:center; gap:7px; }
  .seg-item .value{ color:var(--text-sub); }

  /* ---- 노출 범례 select 드롭다운 ---- */
  .legend-select{ display:flex; align-items:center; gap:8px; }
  .legend-select-label{ font-size:12px; color:var(--text-sub); }
  .legend-dropdown{ position:relative; }
  .legend-dropdown-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    min-width:140px; padding:7px 11px;
    border:1px solid #e3e3e6; border-radius:8px;
    background:#fff; font-size:12px; color:var(--text-main); cursor:pointer;
  }
  .legend-dropdown-btn .caret{ color:var(--text-sub); font-size:10px; }
  .legend-menu{
    position:absolute; right:0; top:calc(100% + 6px);
    min-width:170px; padding:6px;
    background:#fff; border:1px solid #eee; border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,0.12);
    display:none; z-index:20;
  }
  .legend-menu.open{ display:block; }
  .legend-menu-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:8px;
    font-size:13px; color:var(--text-main); cursor:pointer;
  }
  .legend-menu-item:hover{ background:#f5f6f8; }
  .legend-menu-item input{ width:15px; height:15px; accent-color:#3f5be0; cursor:pointer; }

  /* ---- 하단 가로 범례 ---- */
  .chart-legend{ display:flex; gap:16px; }
  .chart-legend .item{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-sub); cursor:pointer; user-select:none;
  }
  .chart-legend .item.off{ opacity:0.35; text-decoration:line-through; }
</style>
</head>
<body>

<!-- Chart 1: 시간대별 인증이용량 추이 (Stacked Bar) -->
<div class="card">
  <div class="card-header">
    <div>
      <div class="card-title">시간대별 인증이용량 추이 <span class="badge">즉시결제 ▾</span></div>
      <div class="card-sub">07.06 13:00 ~ 07.07 13:00 기준</div>
    </div>
    <!-- 노출 범례 select 드롭다운 (체크리스트로 표시 여부 선택) -->
    <div class="legend-select">
      <span class="legend-select-label">노출 범례</span>
      <div class="legend-dropdown">
        <button type="button" class="legend-dropdown-btn" id="legendBtn">
          <span id="legendBtnText">전체</span>
          <span class="caret">▾</span>
        </button>
        <div class="legend-menu" id="legendMenu"><!-- 체크박스 항목은 JS로 생성 --></div>
      </div>
    </div>
  </div>
  <!-- 넓은 차트를 가로 스크롤로 표시 -->
  <div class="chart-scroll">
    <canvas id="stackedChart" width="1600" height="220"></canvas>
  </div>
  <div class="footer-row">
    <span>오늘 (07.06)</span>
    <!-- 하단 가로 범례 (JS로 생성) -->
    <div class="chart-legend" id="chartLegend"></div>
  </div>
</div>

<!-- Chart 2: 일간 인증수단별 이용량 (Segmented bar) -->
<div class="card">
  <div class="card-header">
    <div class="card-title">일간 인증수단별 이용량</div>
    <div class="card-sub">07.07 기준</div>
  </div>
  <canvas id="segChart" width="584" height="100"></canvas>
  <div class="seg-list" id="segList"></div>
</div>

<script>
// 공통 차트 번들(module)은 defer 실행이므로, DOMContentLoaded 이후에 사용해야 함
document.addEventListener("DOMContentLoaded", function () {
/* ============ Chart 1: Stacked bar with Chart.js ============ */
// 00:00 ~ 23:00 (24시간, 1시간 단위)
const hours = [
  "00:00","01:00","02:00","03:00","04:00","05:00","06:00","07:00",
  "08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00",
  "16:00","17:00","18:00","19:00","20:00","21:00","22:00","23:00"
];
// 새벽 저조 -> 주간 피크 -> 야간 감소의 일간 패턴 (13:00 스파이크)
const failData = [
  280, 240, 320, 300, 260, 250, 340, 360,
  350, 330, 290, 310, 330, 780, 340, 320,
  360, 390, 420, 400, 380, 350, 330, 300
];
const successData = [
  1100, 900, 1400, 1350, 1050, 1000, 1500, 1580,
  1520, 1470, 1250, 1360, 1470, 2420, 1560, 1620,
  1700, 1850, 1980, 1900, 1780, 1600, 1420, 1250
];
const selectedIndex = 13; // 13:00 highlighted, matches tooltip example

// 1주일 전 같은 시간대 데이터 (비교용) — 13:00 스파이크 없이 평소 수준
const failDataPrev = [
  260, 230, 300, 290, 250, 240, 320, 340,
  330, 310, 280, 300, 320, 340, 330, 310,
  350, 370, 400, 380, 360, 340, 310, 290
];
const successDataPrev = [
  1050, 880, 1320, 1280, 1000,  960, 1430, 1500,
  1460, 1400, 1200, 1300, 1400, 1480, 1500, 1550,
  1630, 1770, 1890, 1820, 1700, 1540, 1360, 1200
];

// CSS 변수를 한 번만 읽어오는 헬퍼 (색은 :root 에서 단일 관리)
const css = getComputedStyle(document.documentElement);
const c = (name) => css.getPropertyValue(name).trim();

// hex 색상에 투명도 적용 (a: 0~1) -> #RRGGBBAA
const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, '0');

// y축 최대값을 전체 데이터 기준으로 미리 계산해 고정한다.
// (범례 토글 시 축이 재계산되어 그래프 높이가 변하는 것을 방지)
const Y_MAX = Math.ceil(
  Math.max(...successData, ...failData, ...successDataPrev, ...failDataPrev) * 1.2 / 100
) * 100;

const stackedChart = common.CommonChart.create('stackedChart', {
  type: 'line',
  data: {
    labels: hours,
    // 채우기 없는 일반 line 차트 (선만 표시)
    datasets: [
      {
        label: '오늘성공',
        data: successData,
        borderColor: c('--success-active'),
        backgroundColor: c('--success-active'),
        fill: false,
        tension: 0,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5
      },
      {
        label: '오늘실패',
        data: failData,
        borderColor: c('--fail-active'),
        backgroundColor: c('--fail-active'),
        fill: false,
        tension: 0,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5
      },
      // 1주일 전 비교 — 같은 형태(실선), 색상만 연하게
      {
        label: '전주성공',
        data: successDataPrev,
        borderColor: alpha(c('--success-active'), 0.5),
        backgroundColor: alpha(c('--success-active'), 0.5),
        fill: false,
        tension: 0,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5
      },
      {
        label: '전주실패',
        data: failDataPrev,
        borderColor: alpha(c('--fail-active'), 0.5),
        backgroundColor: alpha(c('--fail-active'), 0.5),
        fill: false,
        tension: 0,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5
      }
    ]
  },
  options: {
    // 크기는 canvas의 width/height 속성(584x220)을 그대로 사용
    responsive: false,
    // 같은 시간대의 실패·성공을 하나의 툴팁에 함께 표시
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        grid: { display:false },
        ticks:{
          color:'#8a8a8f',
          font:{size:11},
          autoSkip: true,      // 겹치면 자동 생략 (폭이 넓어 대부분 표시됨)
          maxTicksLimit: 24,
          maxRotation: 0
        }
      },
      // stacked: false -> 누적하지 않고 각 값을 0선 기준으로 그린다
      // min/max 고정 -> 범례 토글로 dataset을 숨겨도 축이 재계산되지 않아 높이가 유지된다
      y: {
        stacked: false,
        display: true,
        min: 0,
        max: Y_MAX,
        border: { display: false },
        grid: { color: '#f0f0f2' },
        ticks: {
          color: '#8a8a8f',
          font: { size: 11 },
          maxTicksLimit: 5,
          callback: (v) => v.toLocaleString() + ' 건'   // 단위 표시
        }
      }
    },
    plugins: {
      // 내장 범례 사용 안 함 -> 우상단 select 드롭다운 + 하단 커스텀 범례로 대체
      legend: { display: false },
      tooltip: {
        backgroundColor:'#fff',
        titleColor:'#1c1c1e',
        bodyColor:'#1c1c1e',
        borderColor:'#eee',
        borderWidth:1,
        padding:10,
        displayColors:true,
        position: 'barTop',  // 해당 시각의 최상단 지점에 앵커 (공통 모듈에 등록)
        xAlign: 'center',
        yAlign: 'bottom',    // 툴팁을 앵커 위쪽에 표시
        caretPadding: 6,
        callbacks: {
          title: (items) => `전체 인증 ${ (failData[items[0].dataIndex] + successData[items[0].dataIndex]).toLocaleString() }건`,
          label: (item) => `${item.dataset.label}  ${item.raw.toLocaleString()}건`
        }
      }
    }
  }
});

/* ── 노출 범례 select 드롭다운 + 하단 범례 ──────────────────────── */
(function setupLegendSelect() {
  const legendBtn     = document.getElementById('legendBtn');
  const legendBtnText = document.getElementById('legendBtnText');
  const legendMenu    = document.getElementById('legendMenu');
  const chartLegend   = document.getElementById('chartLegend');

  // dataset 정보 (index, label, 색상)
  const items = stackedChart.data.datasets.map((ds, i) => ({
    index: i, label: ds.label, color: ds.borderColor
  }));

  const isVisible = (i) => stackedChart.isDatasetVisible(i);

  // 버튼 텍스트: "오늘성공 외 3개" 형태
  function updateBtnText() {
    const on = items.filter(it => isVisible(it.index));
    legendBtnText.textContent =
      on.length === 0 ? '없음'
      : on.length === 1 ? on[0].label
      : `${on[0].label} 외 ${on.length - 1}개`;
  }

  // 하단 범례의 on/off 표시 동기화
  function syncBottomLegend() {
    chartLegend.querySelectorAll('.item').forEach(el => {
      el.classList.toggle('off', !isVisible(Number(el.dataset.index)));
    });
  }

  // dataset 표시/숨김 토글
  function toggle(index, visible) {
    stackedChart.setDatasetVisibility(index, visible);
    stackedChart.update();
    const cb = legendMenu.querySelector(`input[data-index="${index}"]`);
    if (cb) cb.checked = visible;
    updateBtnText();
    syncBottomLegend();
  }

  // 드롭다운 체크박스 항목 생성
  items.forEach(it => {
    const label = document.createElement('label');
    label.className = 'legend-menu-item';
    label.innerHTML =
      `<input type="checkbox" data-index="${it.index}" ${isVisible(it.index) ? 'checked' : ''}>` +
      `<span>${it.label}</span>`;
    label.querySelector('input')
      .addEventListener('change', (e) => toggle(it.index, e.target.checked));
    legendMenu.appendChild(label);
  });

  // 하단 가로 범례 생성 (클릭으로도 토글)
  items.forEach(it => {
    const el = document.createElement('span');
    el.className = 'item';
    el.dataset.index = it.index;
    el.innerHTML = `<span class="dot" style="background:${it.color}"></span>${it.label}`;
    el.addEventListener('click', () => toggle(it.index, !isVisible(it.index)));
    chartLegend.appendChild(el);
  });

  // 드롭다운 열기/닫기
  legendBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    legendMenu.classList.toggle('open');
  });
  legendMenu.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => legendMenu.classList.remove('open'));

  updateBtnText();
  syncBottomLegend();
})();

/* ============ Chart 2: Segmented bar, pure vanilla JS ============ */
const segData = [
  { name:'SOL페이',    value:15678, color:'#5b6bf0' },
  { name:'카드인증',   value:8974,  color:'#26c6da' },
  { name:'금융인증서', value:2230,  color:'#c9b8f5' },
  { name:'사설인증서', value:1808,  color:'#26a69a' },
  { name:'신한인증서', value:1678,  color:'#3fbf5f' },
  { name:'휴대폰인증', value:978,   color:'#ec6cab' }
];
const total = segData.reduce((s, d)=>s+d.value,0);

// 툴팁 positioner 'segMiddle' 은 공통 모듈(grid/chart.js)에 등록되어 있음
const lastIdx = segData.length - 1;

// 마우스 오버한 세그먼트 index (null = 없음). 오버 시 나머지를 흐리게 표시하는 포커싱용
let segHoverIdx = null;

common.CommonChart.create('segChart', {
  type: 'bar',
  data: {
    labels: [''], // 막대 1개(단일 카테고리)에 각 인증수단이 세그먼트로 쌓임
    datasets: segData.map((d, i) => ({
      label: d.name,
      data: [d.value],
      // 오버 대상(또는 오버 없음)은 원색, 나머지는 흐리게 -> 포커싱 효과
      backgroundColor: () =>
        (segHoverIdx === null || segHoverIdx === i) ? d.color : alpha(d.color, 0.25),
      barThickness: 28,
      borderSkipped: false,
      // 전체 막대 양 끝만 둥글게 (첫 세그먼트=왼쪽, 마지막 세그먼트=오른쪽)
      borderRadius:
        i === 0        ? { topLeft: 14, bottomLeft: 14 } :
        i === lastIdx  ? { topRight: 14, bottomRight: 14 } :
        0
    }))
  },
  options: {
    indexAxis: 'y',            // 가로 막대
    // 크기는 canvas의 width/height 속성(584x100)을 그대로 사용
    responsive: false,
    layout: { padding: 0 },
    // 마우스 오버한 세그먼트를 추적해 포커싱 (나머지 흐리게)
    onHover: (evt, elements, chart) => {
      const idx = elements.length ? elements[0].datasetIndex : null;
      if (idx !== segHoverIdx) {
        segHoverIdx = idx;
        chart.update('none');   // 애니메이션 없이 즉시 반영
      }
    },
    scales: {
      x: { stacked: true, display: false, max: total }, // total로 폭 100% 고정
      y: { stacked: true, display: false }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor:'#fff',
        titleColor:'#1c1c1e',
        bodyColor:'#1c1c1e',
        borderColor:'#eee',
        borderWidth:1,
        padding:10,
        position: 'segMiddle', // 세그먼트 가로 정중앙에 앵커
        xAlign: 'center',    // 앵커 기준 가운데 정렬 (한쪽으로 쏠림 방지)
        yAlign: 'bottom',    // 툴팁을 막대 위쪽에 표시 (겹침 방지)
        caretPadding: 8,     // 막대와 툴팁 사이 간격
        callbacks: {
          label: (item) => {
            const pct = (item.raw / total * 100).toFixed(1);
            return `${item.dataset.label}  ${item.raw.toLocaleString()}건 (${pct}%)`;
          }
        }
      }
    }
  }
});

const segList = document.getElementById('segList');
segData.forEach(d => {
  const pct = Math.round(d.value/total*100);
  const item = document.createElement('div');
  item.className = 'seg-item';
  item.innerHTML = `
    <span class="label"><span class="dot" style="background:${d.color}"></span>${d.name} <b>${pct}%</b></span>
    <span class="value">${d.value.toLocaleString()} 건</span>
  `;
  segList.appendChild(item);
});
});
</script>
</body>
</html>
