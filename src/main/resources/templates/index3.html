<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>gridTest</title>

    <!-- Tabulator CSS (JS는 grid.min.js 번들에 포함) -->
    <link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <style>
        /* pagination.js(common.CommonPagination) 컴포넌트 스타일 */
        .pg-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;   /* 페이지 번호 가운데 */
            position: relative;
            width: 1000px;
            margin-top: 12px;
        }
        .pg-pagination { display: flex; align-items: center; gap: 4px; }
        .pg-arrow, .pg-page {
            min-width: 30px; height: 30px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0 8px;
            border: 1px solid #e3e3e6; border-radius: 6px;
            background: #fff; color: #333; font-size: 13px; cursor: pointer;
        }
        .pg-arrow svg { width: 14px; height: 14px; }
        .pg-page.active { background: #1D68CD; border-color: #1D68CD; color: #fff; font-weight: 700; }
        .pg-arrow:disabled { opacity: 0.4; cursor: default; }
        .pg-page:hover:not(.active), .pg-arrow:hover:not(:disabled) { background: #f0f2f5; }

        /* 크기 선택 (오른쪽 고정) */
        .pg-size-select { position: absolute; right: 0; }
        .pg-size-btn {
            display: inline-flex; align-items: center; gap: 6px;
            height: 30px; padding: 0 10px;
            border: 1px solid #e3e3e6; border-radius: 6px; background: #fff;
            font-size: 13px; cursor: pointer;
        }
        .pg-size-btn svg { width: 14px; height: 14px; color: #8a8a8f; }
        .pg-size-menu {
            display: none; position: absolute; right: 0; top: calc(100% + 4px);
            min-width: 90px; background: #fff; border: 1px solid #eee; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12); overflow: hidden; z-index: 20;
        }
        .pg-size-select.open .pg-size-menu { display: block; }
        .pg-size-option { padding: 8px 12px; font-size: 13px; cursor: pointer; }
        .pg-size-option:hover { background: #f5f6f8; }
        .pg-size-option.selected { color: #1D68CD; font-weight: 700; }
    </style>
</head>
<body>
    <h1 th:text="${message}">기본 메시지</h1>
    <div style="margin-bottom: 8px;">
        <button type="button" id="btnAddRow" class="grid-btn">행 추가</button>
        <button type="button" id="btnDeleteRow" class="grid-btn">선택 삭제</button>
        <button type="button" id="btnSave" class="grid-btn">변경분 저장</button>
    </div>
    <div id="serviceGrid" style="height: 500px; width: 1000px;"></div>

    <!-- 커스텀 페이저 컨테이너 (common.CommonPagination 이 이 안에 렌더) -->
    <div id="customPager"></div>

    <!-- 공통 그리드 번들 (grid2.js → window.common.CommonGrid) -->
    <script type="module" th:src="@{/js/lib/grid.min.js}"></script>
    <script nomodule th:src="@{/js/lib/polyfills-legacy.min.js}"></script>
    <script nomodule th:src="@{/js/lib/grid-legacy.min.js}"></script>

    <!-- 공통 페이지네이션 컴포넌트 -->
    <script th:src="@{/js/pagination.js}"></script>

    <script th:src="@{/js/index3.js}"></script>
</body>
</html>
